[package]
name = "visual-files-tauri-demo"
version = "0.1.0"
description = "Disposable Tauri host benchmark for Visual Files"
authors = ["Visual Files benchmark"]
edition = "2021"

[lib]
name = "visual_files_tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"

